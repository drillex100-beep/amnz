name: Build Amnezia Client Android APK

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
        
    # ИСПРАВЛЕННЫЙ ШАГ: Установка Qt с помощью другого действия
    - name: Install Qt 5.15.2 for Android
      uses: Skycoder42/action-setup-qt@v1
      with:
        version: 5.15.2
        target: android
        arch: android_arm64_v8a
        dir: ${{ runner.temp }}/Qt # Временная директория для установки
        
    - name: Install Android SDK, NDK and CMake
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: |
        yes | sdkmanager --licenses > /dev/null

    - name: Install specific Android SDK platforms and NDK
      run: |
        # Проект использует определенные версии.
        sdkmanager "platforms;android-33" "ndk;25.1.8937393"

    - name: Configure CMake for Android Build
      run: |
        # Важно: нам нужно правильно указать путь к qmake/cmake из нового места установки
        export QT_QMAKE_EXECUTABLE=${{ runner.temp }}/Qt/5.15.2/android_arm64_v8a/bin/qmake
        cmake -S client -B build_android \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_PLATFORM=android-33 \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_STL=c++_shared \
          -DCMAKE_BUILD_TYPE=Release \
          -DQT_QMAKE_EXECUTABLE=$QT_QMAKE_EXECUTABLE

    - name: Build Android Project
      run: |
        cmake --build build_android --parallel $(nproc)

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AmneziaVPN-Android-APK
        path: build_android/client/android-build/build/outputs/apk/release/*.apk
