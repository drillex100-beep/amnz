name: Build Amnezia Client Android APK (Fork Adapted)

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      # Используем официальные версии из рабочего процесса Amnezia VPN
      # Проект использует Qt 6.4.1 согласно их tag-deploy.yml
      QT_VERSION: 6.4.1
      NDK_VERSION: 23c
      ANDROID_NDK_PLATFORM: android-23

    steps:
    - name: Get sources
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 1 

    - name: 'Install android Qt arm_v8'
      # Используем проверенный action из официального репозитория
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'android'
        arch: 'android_arm64_v8a'
        # Добавляем все необходимые модули, включая Network
        modules: 'qtremoteobjects qt5compat qtimageformats qtshadertools network'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        set-env: 'true'

    - name: 'Setup Java'
      # Устанавливаем JDK 11, как требуется для Android NDK/SDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: 'Install Android NDK and run build script'
      run: |
        # Установка NDK вручную, как в оригинальном скрипте
        export ANDROID_NDK_HOME=${{ runner.temp }}/android-ndk-r${{ env.NDK_VERSION }}
        export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME

        if [ ! -f $ANDROID_NDK_ROOT/ndk-build ]; then 
          echo "Downloading NDK r${{ env.NDK_VERSION }}"
          wget https://dl.google.com{{ env.NDK_VERSION }}-linux.zip -qO ${{ runner.temp }}/ndk.zip &&
          unzip -q -d ${{ runner.temp }} ${{ runner.temp }}/ndk.zip ; 
        fi
        
        # Устанавливаем пути, которые ожидает скрипт build_android.sh
        export QT_HOST_PATH="${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/gcc_64"
        export QT_BIN_DIR=${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/android_arm64_v8a/bin
        
        # Запускаем официальный скрипт сборки из репозитория, 
        # указывая ТОЛЬКО нужную архитектуру (ABI), чтобы избежать ошибки mv
        bash deploy/build_android.sh --abi arm64-v8a

    - name: 'Upload Unsigned APK Artifact'
      uses: actions/upload-artifact@v4
      with:
        name: AmneziaVPN-Android-Unsigned-APK
        # Скрипт build_android.sh теперь создаст файл с точным именем архитектуры
        path: AmneziaVPN-arm64-v8a-release-unsigned.apk
